<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download SYS13 Extension</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-soft: #f3f4f6;
        --primary: #8e6a5e;
        --primary-dark: #694f45;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --shadow: rgba(0, 0, 0, 0.22);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: var(--text);
      }

      .card {
        width: min(680px, 90vw);
        background: rgba(31, 41, 55, 0.92);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 18px 40px var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 2.6rem);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 22px;
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        background: var(--primary);
        color: white;
        padding: 16px 26px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1.05rem;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .download-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .meta {
        margin-top: 28px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
      }

      .meta strong {
        display: block;
        margin-bottom: 8px;
        color: #fff;
      }

      ul {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
      }

      li + li {
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SYS13 Extension</h1>
      <p>
        Download the browser extension package as a ZIP file for installation or distribution.
      </p>

      <a class="download-btn" href="./extension.zip" download="sys13-extension.zip">
        Download ZIP
      </a>

      <div class="meta">
        <strong>Included in the package</strong>
        <ul>
          <li>Manifest file</li>
          <li>Background script</li>
          <li>Popup and options UI</li>
          <li>Styles and assets</li>
        </ul>
      </div>
    </main>
  </body>
</html>
